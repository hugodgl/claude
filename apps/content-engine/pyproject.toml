[project]
name = "content-engine"
version = "0.1.0"
description = "Moteur de contenu YouTube / TikTok / Pinterest / LinkedIn : banque de sujets, scripts, validation, rendu vertical, publication"
requires-python = ">=3.11"
# `core` (packages/core) s'installe à part, en mode éditable : voir README.
dependencies = [
  "typer>=0.12",
  "rich>=13",
  "pyyaml>=6",
  "httpx>=0.27",
  "pydantic>=2.7",
  "pydantic-settings>=2.3",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.5"]
youtube = ["google-auth-oauthlib>=1.2"]
kokoro = ["kokoro-onnx>=0.4"]

[project.scripts]
ce = "content_engine.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/content_engine"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
