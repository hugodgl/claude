[project]
name = "newsletter-pipeline"
version = "0.1.0"
description = "Newsletter hebdo « l'IA pour les cabinets d'expertise comptable » : collecte, classement LLM, brouillon, push beehiiv, posts LinkedIn"
requires-python = ">=3.11"
dependencies = [
  "core",
  "typer>=0.12",
  "pyyaml>=6.0",
  "feedparser>=6.0.11",
  "httpx>=0.27",
  "trafilatura>=2.0",  # bare_extraction renvoie un objet Document (en 1.x : un dict)
  "jinja2>=3.1",
  "markdown>=3.6",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.5"]

[project.scripts]
np = "newsletter_pipeline.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/newsletter_pipeline"]

[tool.hatch.metadata]
allow-direct-references = true

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning"]

[tool.ruff]
line-length = 120
target-version = "py311"
extend-exclude = [".venv", "issues", "out", "data"]

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP", "B"]
ignore = ["B008"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E501"]
