# Sources de veille. `np collect` synchronise ce fichier dans la base (table `sources`).
#
# Champs : name (unique), url, kind (rss | page), category (editeurs | presse_pro | institutions |
#          ia_generale | newsletters_en | autre), lang, weight (poids multiplicatif du score, ]0 ; 3]),
#          active, verify (URL à vérifier à la main au premier passage réel), include_patterns (pour
#          kind=page : regex des liens à suivre depuis la page de liste), notes.
#
# Les URL de flux sont plausibles mais n'ont pas pu être vérifiées depuis le sandbox : toute source
# marquée `verify: true` est à contrôler avec `np collect --source "<name>" --dry-run` sur le Mac mini.

defaults:
  lang: fr
  weight: 1.0
  active: true
  verify: true

sources:
  # ----------------------------------------------------------------- éditeurs comptables (0.9)
  - name: Dext (blog FR)
    url: https://dext.com/fr/ressources/blog-actualite-comptable
    kind: page
    category: editeurs
    weight: 0.9
    include_patterns: ["/blog-actualite-comptable/single/"]
  - name: Pennylane (blog)
    url: https://www.pennylane.com/fr/blog/
    kind: page
    category: editeurs
    weight: 0.9
    include_patterns: ["/fr/blog/[a-z0-9-]+"]
  - name: Cegid (blog)
    url: https://www.cegid.com/fr/blog/feed/
    kind: rss
    category: editeurs
    weight: 0.9
    notes: Site WordPress, le flux /feed/ est probable ; sinon passer en kind=page sur /fr/blog/.
  - name: Sage Advice France
    url: https://www.sage.com/fr-fr/blog/feed/
    kind: rss
    category: editeurs
    weight: 0.9
  - name: ACD (actualités)
