<!doctype html>
<html lang="fr">
<head><meta charset="utf-8"><title>{% block subject %}{{ app_name }}{% endblock %}</title></head>
<body style="margin:0;padding:24px;background:#f4f4f2;font-family:-apple-system,Segoe UI,Helvetica,Arial,sans-serif;color:#1b1b1b;">
  <table role="presentation" width="100%" cellpadding="0" cellspacing="0"><tr><td align="center">
    <table role="presentation" width="600" cellpadding="0" cellspacing="0" style="max-width:600px;background:#fff;border-radius:10px;padding:28px;">
      <tr><td>
        <p style="margin:0 0 16px;font-weight:700;color:#2b5d3f;">{{ app_name }}</p>
        {% block body %}{% endblock %}
        <p style="margin:24px 0 0;font-size:12px;color:#777;">{{ app_name }} · email automatique, vous pouvez y répondre.</p>
      </td></tr>
    </table>
  </td></tr></table>
</body>
</html>
